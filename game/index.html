<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d15">
  <title>NEON HARBOR: Palm Vice</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080d15; }
    #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="NEON HARBOR: Palm Vice game"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
